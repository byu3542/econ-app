plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.economic.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.economic.dashboard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Read Anthropic API Key from local.properties
        def properties = new Properties()
        def propertiesFile = rootProject.file('local.properties')
        if (propertiesFile.exists()) {
            properties.load(propertiesFile.newDataInputStream())
        }
        // AI Analyst proxy (see proxy/README.md). The Anthropic key itself lives
        // server-side only and is never compiled into the app.
        buildConfigField "String", "PROXY_BASE_URL", "\"${properties.getProperty('PROXY_BASE_URL', '')}\""
        buildConfigField "String", "PROXY_APP_TOKEN", "\"${properties.getProperty('PROXY_APP_TOKEN', '')}\""
        buildConfigField "String", "FRED_API_KEY", "\"${properties.getProperty('FRED_API_KEY', 'YOUR_FRED_API_KEY')}\""
        buildConfigField "String", "BEA_API_KEY", "\"${properties.getProperty('BEA_API_KEY', 'YOUR_BEA_API_KEY')}\""
        buildConfigField "String", "BLS_API_KEY", "\"${properties.getProperty('BLS_API_KEY', 'YOUR_BLS_API_KEY')}\""
        buildConfigField "String", "NEWS_API_KEY", "\"${properties.getProperty('NEWS_API_KEY', 'YOUR_NEWS_API_KEY')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding false
        buildConfig true
    }
}

// ── Badge regression guard (R2-TICKET-10) ────────────────────────────────────
// Fails `gradlew check` if a status badge is styled anywhere other than
// @style/Badge.Status + layout/view_status_badge.xml. See scripts/check_badges.sh
// for what it catches and why. Skipped automatically if bash isn't on PATH, so a
// plain Windows box without Git Bash still builds.
tasks.register('checkBadges', Exec) {
    group = 'verification'
    description = 'Fails if a status badge is styled outside @style/Badge.Status.'
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/check_badges.sh'
    // Don't break the build on machines with no bash; the CI/dev box that has it
    // still enforces the rule.
    ignoreExitValue = false
    onlyIf {
        try {
            def probe = new ProcessBuilder('bash', '-c', 'exit 0').start()
            probe.waitFor() == 0
        } catch (Exception ignored) {
            logger.lifecycle('checkBadges: bash not found, skipping badge guard.')
            false
        }
    }
}

// Hook `preBuild` as well as `check` — a normal Studio Run/assembleDebug should
// catch a violation, not just an explicit `gradlew check`. The script is a few
// greps, so the cost per build is negligible.
tasks.named('check') { dependsOn 'checkBadges' }
tasks.named('preBuild') { dependsOn 'checkBadges' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'  // skeleton loading
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'  // IOS-01 press springs
    implementation 'androidx.core:core-ktx:1.13.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // Claude AI (Anthropic REST API via OkHttp — already included above)

    // Markdown rendering for AI Agent responses
    implementation 'io.noties.markwon:core:4.6.2'

    // Chrome Custom Tabs (News feature)
    implementation 'androidx.browser:browser:1.8.0'

    // Room (local database for caching economic data)
    implementation 'androidx.room:room-runtime:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WorkManager (background refresh scheduling)
    implementation 'androidx.work:work-runtime:2.9.0'

    // Unit testing (JVM tests in app/src/test)
    testImplementation 'junit:junit:4.13.2'
}
